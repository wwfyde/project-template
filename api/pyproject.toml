[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "wwfyde", email = "wwfyde@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20.0",
  "alibabacloud-oss-v2>=1.4.0",
  "anthropic>=0.119.0",
  "claude-agent-sdk>=0.2.126",
  "dashscope>=1.26.4",
  "fastapi>=0.143.2",
  "fastapi-redis-sdk[otel]>=0.9.0", # https://redis.github.io/fastapi-redis-sdk/latest/
  "google-genai>=2.14.0",
  "httpx2[http2,socks]>=2.12.0",
  "langchain>=1.3.2",
  "langchain-openai>=1.2.2",
  "langgraph>=1.2.2",
  "openai>=3.31.0",
  "openai-agents>=0.24.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-instrumentation-logging>=0.66b1",
  "opentelemetry-instrumentation-psycopg>=0.66b1",
  "opentelemetry-sdk>=1.45.1",
  "pillow>=12.3.0",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.29",
  "python-socks[asyncio]>=3.1.1",
  "redis[otel]>=8.1.0",
  "sqlalchemy[asyncio]>=2.1.4",
  "tenacity>=9.1.4",
  "uuid-utils>=0.17.1",
  "uvicorn>=0.54.0",
  "volcengine-python-sdk[ark]>=5.0.43",
  "websockets>=16.0",
]

[project.scripts]
api = "api:main"
dev = "api.commands:dev"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyrefly>=1.1.1", "pytest>=9.0.2", "pytest-asyncio>=1.3.0", "ruff>=0.14.14", "ty>=0.0.88"]
[tool.uv]
override-dependencies = ["websockets>=16.0"]

[tool.uv.sources]
