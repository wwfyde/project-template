[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "wwfyde", email = "wwfyde@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20.0",
  "alibabacloud-oss-v2>=1.4.0",
  "anthropic>=0.119.0",
  "claude-agent-sdk>=0.2.126",
  "dashscope>=1.26.4",
  "fastapi>=0.139.2",
  "fastapi-redis-sdk>=0.9.0", # https://redis.github.io/fastapi-redis-sdk/latest/
  "google-genai>=2.14.0",
  "httpx2[http2,socks]>=2.12.0",
  "langchain>=1.3.2",
  "langchain-openai>=1.2.2",
  "langgraph>=1.2.2",
  "openai>=3.31.0",
  "pillow>=12.3.0",
  "psycopg[binary,pool]>=3.3.2",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.14.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.29",
  "python-socks[asyncio]>=3.1.1",
  "redis>=8.1.0",
  "sqlalchemy[asyncio]>=2.1.4",
  "tenacity>=9.1.4",
  "uuid-utils>=0.17.0",
  "uvicorn>=0.51.0",
  "volcengine-python-sdk[ark]>=5.0.42",
  "websockets>=16.0",
]

[project.scripts]
api = "api:main"
dev = "api.commands:dev"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pyright>=1.1.410",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]
[tool.uv]
override-dependencies = ["websockets>=16.0"]

[tool.uv.sources]
