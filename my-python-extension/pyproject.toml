[project]
name = "my-python-extension"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "wwfyde", email = "wwfyde@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[tool.maturin]
module-name = "my_python_extension._my_python_extension"
python-packages = ["my_python_extension"]
python-source = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.rs" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
