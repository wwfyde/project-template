[project]
name = "project-template" # NOT "my-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  # api
  "api",
  "use-extension",
]

[tool.uv]
package = false
override-dependencies = [
  # "numpy==1.26.4",
  "websockets>=16.0",
]


[tool.uv.workspace]
members = [
  "api",
  "python-extension-with-rust",
  "python/use-extension",
  # "my-python-extension",
]

[tool.uv.sources]
api = { workspace = true }
use-extension = { workspace = true }

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
[tool.ruff.lint]
select = ["ANN"]

[dependency-groups]
dev = [
  "coverage>=7.15.2",
  "ipython>=9.12.0",
  "pyrefly>=1.1.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.12",
  "rust-just>=1.57.0",
  "ty>=0.0.87",
]
