[project]
name = "project-template" # NOT "my-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  # api
  "api",
  "alembic>=1.20.0",
  "alibabacloud-oss-v2>=1.4.0",
  "dashscope>=1.27.7",
  "fastapi>=0.143.1",
  "google-genai>=2.31.0",
  "httpx2[http2,socks]>=2.13.1",
  "langchain-openai>=1.7.2",
  "openai>=2.32.0",
  "openai-agents>=0.24.0",
  "pillow>=12.3.0",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic>=2.13.2",
  "pydantic-settings>=2.14.2",
  "python-dotenv>=1.2.4",
  "python-multipart>=0.0.22",
  "redis>=8.1.0",
  "tenacity>=9.1.4",
  "uuid-utils>=0.17.1",
  "uvicorn>=0.51.0",
  "volcengine-python-sdk[ark]>=5.0.52",
  "websockets>=16.0",
  "fastapi-redis-sdk>=0.9.0",
]

[tool.uv]
package = false
override-dependencies = [
  # "numpy==1.26.4",
  "websockets>=16.0",
]


[tool.uv.workspace]
members = [
  "api",
  "python-extension-with-rust",
  #    "libs/utils",
  #    "libs/config",
  #    "examples/agentscope_app",
  #    "web/libs/utils",
  #    "llm-providers",
  #    "kayn-core",
  #    "langchain-examples",
]

[tool.uv.sources]
libs-config = { workspace = true }
api = { workspace = true }

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ANN"]

[dependency-groups]
dev = [
  "coverage>=7.15.2",
  "ipython>=9.12.0",
  "pyrefly>=1.1.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.12",
  "rust-just>=1.57.0",
  "ty>=0.0.87",
]
