[project]
name = "mylib"
version = "0.1.0"
description = "Reusable Python utilities for project-template."
readme = "README.md"
authors = [
    { name = "wwfyde", email = "wwfyde@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/wwfyde/project-template"
Issues = "https://github.com/wwfyde/project-template/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.12",
    "twine>=6.2.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Keep the import name stable if the PyPI distribution name changes.
module-name = "mylib"
source-include = ["tests/**", "scripts/**", ".python-version"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
