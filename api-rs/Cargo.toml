[package]
name = "api_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
default-run = "api_rs"

[dependencies]

# web Framework
axum = { version = "0.8.9", features = ["default", "macros"] }

# serialization and deserialization
serde = { version = "1.0", features = ["derive"] }

# async runtime
tokio = { version = "1", features = ["full"] }

# database
sea-orm = { version = "2.0.4", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
sqlx = { version = "0.9", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "chrono",
  "uuid",
  "derive",
] }

tracing-subscriber = "0.3.18"
clap = { version = "4.4.5", features = ["derive", "env"] }

# openapi documentation
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }

# error handling
anyhow = "1.0"

# logging and tracing
tracing = "0.1.41"


# utilities
uuid = { version = "1.0", features = ["v7", "serde", "fast-rng"] }
chrono = "0.4.39"


dotenvy = "0.15"
config = "0.15.6"
serde_json = "1.0.140"
http = "1.3.1"
url = "2"
percent-encoding = "2"
tower-http = { version = "0.6.6", features = ["cors"] }
async-trait = "0.1.89"
validator = { version = "0.18", features = ["derive"] }
bcrypt = "0.18"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
thiserror = "2.0.21"


[dev-dependencies]
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite"] }
tower = { version = "0.5", features = ["util"] }
