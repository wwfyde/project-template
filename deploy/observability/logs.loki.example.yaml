# Merge into the existing limits_config; this is not a full Loki configuration.
# Requires a schema supporting structured metadata (TSDB/v13).
# Apply to the intended tenant if other tenants require different mappings.
limits_config:
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - deployment.environment.name
# Remaining resource attributes, log attributes, trace_id and span_id stay in
# structured metadata. Do not index instance IDs, request IDs or business IDs.
