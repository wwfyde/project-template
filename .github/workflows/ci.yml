name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      api-image:
        description: Published API image digest to verify
        required: true
        type: string
      web-image:
        description: Published web image digest to verify
        required: true
        type: string

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  compose:
    name: Compose integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_IMAGE: ${{ inputs.api-image || 'project-template-api:ci' }}
      WEB_IMAGE: ${{ inputs.web-image || 'project-template-web:ci' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment shell syntax
        run: |
          for script in scripts/deploy.sh scripts/smoke-deploy.sh deploy/*.sh; do
            bash -n "$script"
          done
      - name: Set up Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/Dockerfile
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Log in to pull release images
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test migrations, database, Redis, and HTTP proxy
        run: bash scripts/smoke-deploy.sh
