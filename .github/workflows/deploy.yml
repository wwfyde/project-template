name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        required: true
        default: test
        options: [test, production]

permissions:
  contents: read

# Serialize the whole release, including its build, so a slower older build
# cannot replace a newer deployment. Never cancel an active migration.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || startsWith(github.ref, 'refs/tags/v') && 'production' || 'test' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.release.outputs.environment }}
      image-prefix: ${{ steps.release.outputs.image-prefix }}
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - name: Select release
        id: release
        env:
          TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || startsWith(github.ref, 'refs/tags/v') && 'production' || 'test' }}
        run: |
          {
            printf 'environment=%s\n' "$TARGET_ENVIRONMENT"
            printf 'image-prefix=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}"
            printf 'release-id=%s-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      api-image: ${{ needs.prepare.outputs.image-prefix }}/api@${{ steps.api.outputs.digest }}
      web-image: ${{ needs.prepare.outputs.image-prefix }}/web@${{ steps.web.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.image-prefix }}/api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and publish web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.image-prefix }}/web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  verify:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci.yml
    with:
      api-image: ${{ needs.build.outputs.api-image }}
      web-image: ${{ needs.build.outputs.web-image }}

  deploy:
    needs: [prepare, build, verify]
    environment:
      name: ${{ needs.prepare.outputs.environment }}
    # Runner overrides must be repository variables (JSON label arrays).
    # Environment variables are only available after the runner starts.
    runs-on: ${{ fromJSON(needs.prepare.outputs.environment == 'test' && (vars.TEST_DEPLOY_RUNNER || '["self-hosted","linux","x64","project-template-deploy"]') || (vars.PRODUCTION_DEPLOY_RUNNER || '["ubuntu-latest"]')) }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Set the environment secret SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Set the environment secret SSH_KNOWN_HOSTS}"
          : "${SSH_HOST:?Set the environment variable SSH_HOST}"
          : "${SSH_USER:?Set the environment variable SSH_USER}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9_.:-]+$ ]] || { echo 'Invalid SSH_HOST'; exit 1; }
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_.-]+$ ]] || { echo 'Invalid SSH_USER'; exit 1; }
          if ! [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$SSH_PORT < 1 || 10#$SSH_PORT > 65535 )); then
            echo 'Invalid SSH_PORT'
            exit 1
          fi
          command -v ssh >/dev/null
          command -v tar >/dev/null

          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/project-template-deploy-ssh.XXXXXX")
          printf 'DEPLOY_SSH_DIRECTORY=%s\n' "$ssh_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          cat > "$ssh_dir/config" <<EOF
          Host deployment
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile "$ssh_dir/key"
            UserKnownHostsFile "$ssh_dir/known_hosts"
            GlobalKnownHostsFile /dev/null
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          printf 'DEPLOY_SSH_CONFIG=%s/config\n' "$ssh_dir" >> "$GITHUB_ENV"
      - name: Deploy and verify over SSH
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          DEPLOY_SSH_TARGET: deployment
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          API_IMAGE: ${{ needs.build.outputs.api-image }}
          WEB_IMAGE: ${{ needs.build.outputs.web-image }}
          HTTP_BIND: ${{ vars.HTTP_BIND }}
          HTTP_PORT: ${{ vars.HTTP_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy.sh "$DEPLOY_ENVIRONMENT" "$RELEASE_ID"
      - name: Remove SSH credentials
        if: always()
        run: |
          if [[ -n "${DEPLOY_SSH_DIRECTORY:-}" && "$DEPLOY_SSH_DIRECTORY" == "$RUNNER_TEMP"/project-template-deploy-ssh.* ]]; then
            rm -rf -- "$DEPLOY_SSH_DIRECTORY"
          fi
